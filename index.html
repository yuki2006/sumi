<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>すみません</title>
<style>
  :root {
    --bg: #0f1020;
    --accent: #ff6b6b;
    --accent2: #ffa94d;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0;
    height: 100%;
  }
  body {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 2rem;
    min-height: 100vh;
    background: radial-gradient(circle at 50% 30%, #1b1d3a 0%, var(--bg) 70%);
    font-family: -apple-system, "Hiragino Kaku Gothic ProN", "Yu Gothic", sans-serif;
    color: #fff;
    -webkit-tap-highlight-color: transparent;
  }
  h1 {
    margin: 0;
    font-size: clamp(2rem, 8vw, 3.5rem);
    letter-spacing: 0.1em;
    font-weight: 800;
  }
  p.sub {
    margin: 0;
    opacity: 0.6;
    font-size: 0.95rem;
  }
  button.say {
    border: none;
    cursor: pointer;
    width: min(70vw, 260px);
    height: min(70vw, 260px);
    border-radius: 50%;
    background: linear-gradient(145deg, var(--accent), var(--accent2));
    color: #fff;
    font-size: clamp(1.4rem, 6vw, 2.2rem);
    font-weight: 800;
    box-shadow: 0 20px 50px rgba(255, 107, 107, 0.35);
    transition: transform 0.12s ease, box-shadow 0.12s ease;
    user-select: none;
  }
  button.say:active {
    transform: scale(0.94);
    box-shadow: 0 10px 25px rgba(255, 107, 107, 0.4);
  }
  button.say.pulsing {
    animation: pulse 0.8s ease-in-out infinite;
  }
  @keyframes pulse {
    0%, 100% { transform: scale(1); }
    50% { transform: scale(1.06); }
  }
  .controls {
    display: flex;
    flex-direction: column;
    gap: 0.75rem;
    align-items: center;
    width: min(90vw, 320px);
  }
  .row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    width: 100%;
    gap: 1rem;
    font-size: 0.9rem;
    opacity: 0.85;
  }
  input[type="range"] { flex: 1; accent-color: var(--accent); }
  select {
    background: #1b1d3a;
    color: #fff;
    border: 1px solid #33365e;
    border-radius: 8px;
    padding: 6px 10px;
    font-size: 0.9rem;
    max-width: 180px;
  }
  .hint { font-size: 0.8rem; opacity: 0.5; text-align: center; }
</style>
</head>
<body>
  <div style="text-align:center; display:flex; flex-direction:column; gap:0.4rem;">
    <h1>すみません</h1>
    <p class="sub">タップすると声が出ます</p>
  </div>

  <button class="say" id="sayBtn">すみません</button>

  <div class="controls">
    <div class="row">
      <label for="vol">音量</label>
      <input type="range" id="vol" min="1" max="3" step="0.25" value="2" />
    </div>
    <div class="row">
      <label for="rate">速さ</label>
      <input type="range" id="rate" min="0.5" max="1.5" step="0.1" value="1" />
    </div>
  </div>

  <p class="hint" id="hint"></p>

<script>
  const synth = window.speechSynthesis;
  const btn = document.getElementById("sayBtn");
  const rate = document.getElementById("rate");
  const vol = document.getElementById("vol");
  const hint = document.getElementById("hint");

  const TEXT = "すみません";
  const AUDIO_SRC = "sumimasen.m4a";

  // 録音した音声ファイルを主音源にする（どの端末でも同じ声で鳴る）
  const audio = new Audio(AUDIO_SRC);
  audio.preload = "auto";
  audio.volume = 1.0;

  // Web Audio で端末の最大音量を超えて増幅する
  let audioCtx, gainNode;
  function ensureAudioGraph() {
    if (audioCtx) return;
    try {
      const Ctx = window.AudioContext || window.webkitAudioContext;
      if (!Ctx) return;
      audioCtx = new Ctx();
      const src = audioCtx.createMediaElementSource(audio);
      gainNode = audioCtx.createGain();
      gainNode.gain.value = parseFloat(vol.value);
      src.connect(gainNode).connect(audioCtx.destination);
    } catch (e) { audioCtx = null; }
  }
  vol.addEventListener("input", () => {
    if (gainNode) gainNode.gain.value = parseFloat(vol.value);
  });

  let stopPulse = () => btn.classList.remove("pulsing");

  // 端末に音声合成が無い場合のフォールバック
  function speakFallback() {
    if (!synth) {
      hint.textContent = "この端末では音声を再生できませんでした。";
      stopPulse();
      return;
    }
    synth.cancel();
    const u = new SpeechSynthesisUtterance(TEXT);
    u.lang = "ja-JP";
    u.rate = parseFloat(rate.value);
    const ja = synth.getVoices().find(v => v.lang && v.lang.toLowerCase().startsWith("ja"));
    if (ja) u.voice = ja;
    u.onend = stopPulse;
    u.onerror = stopPulse;
    synth.speak(u);
  }
  if (synth) synth.getVoices(); // 一部ブラウザで声リストを先読み

  function speak() {
    btn.classList.add("pulsing");
    ensureAudioGraph();
    if (audioCtx && audioCtx.state === "suspended") audioCtx.resume();
    if (gainNode) gainNode.gain.value = parseFloat(vol.value);
    audio.onended = stopPulse;
    audio.onerror = speakFallback;
    try {
      audio.currentTime = 0;
      audio.playbackRate = parseFloat(rate.value);
    } catch (e) {}
    const p = audio.play();
    if (p && p.catch) {
      // 録音音声が再生できなければ合成音声で代替
      p.catch(() => speakFallback());
    }
  }

  btn.addEventListener("click", speak);

  // Keyboard: スペース or Enter
  document.addEventListener("keydown", (e) => {
    if (e.code === "Space" || e.code === "Enter") {
      e.preventDefault();
      speak();
    }
  });
</script>
</body>
</html>
