<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>すみません</title>
<style>
  :root {
    --bg: #0f1020;
    --accent: #ff6b6b;
    --accent2: #ffa94d;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0;
    height: 100%;
  }
  body {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 2rem;
    min-height: 100vh;
    background: radial-gradient(circle at 50% 30%, #1b1d3a 0%, var(--bg) 70%);
    font-family: -apple-system, "Hiragino Kaku Gothic ProN", "Yu Gothic", sans-serif;
    color: #fff;
    -webkit-tap-highlight-color: transparent;
  }
  h1 {
    margin: 0;
    font-size: clamp(2rem, 8vw, 3.5rem);
    letter-spacing: 0.1em;
    font-weight: 800;
  }
  p.sub {
    margin: 0;
    opacity: 0.6;
    font-size: 0.95rem;
  }
  button.say {
    border: none;
    cursor: pointer;
    width: min(70vw, 260px);
    height: min(70vw, 260px);
    border-radius: 50%;
    background: linear-gradient(145deg, var(--accent), var(--accent2));
    color: #fff;
    font-size: clamp(1.4rem, 6vw, 2.2rem);
    font-weight: 800;
    box-shadow: 0 20px 50px rgba(255, 107, 107, 0.35);
    transition: transform 0.12s ease, box-shadow 0.12s ease;
    user-select: none;
  }
  button.say:active {
    transform: scale(0.94);
    box-shadow: 0 10px 25px rgba(255, 107, 107, 0.4);
  }
  button.say.pulsing {
    animation: pulse 0.8s ease-in-out infinite;
  }
  @keyframes pulse {
    0%, 100% { transform: scale(1); }
    50% { transform: scale(1.06); }
  }
  .controls {
    display: flex;
    flex-direction: column;
    gap: 0.75rem;
    align-items: center;
    width: min(90vw, 320px);
  }
  .row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    width: 100%;
    gap: 1rem;
    font-size: 0.9rem;
    opacity: 0.85;
  }
  input[type="range"] { flex: 1; accent-color: var(--accent); }
  select {
    background: #1b1d3a;
    color: #fff;
    border: 1px solid #33365e;
    border-radius: 8px;
    padding: 6px 10px;
    font-size: 0.9rem;
    max-width: 180px;
  }
  .hint { font-size: 0.8rem; opacity: 0.5; text-align: center; }
</style>
</head>
<body>
  <div style="text-align:center; display:flex; flex-direction:column; gap:0.4rem;">
    <h1>すみません</h1>
    <p class="sub">タップすると声が出ます</p>
  </div>

  <button class="say" id="sayBtn">すみません</button>

  <div class="controls">
    <div class="row">
      <label for="rate">速さ</label>
      <input type="range" id="rate" min="0.5" max="1.5" step="0.1" value="1" />
    </div>
    <div class="row">
      <label for="pitch">高さ</label>
      <input type="range" id="pitch" min="0.5" max="1.5" step="0.1" value="1" />
    </div>
    <div class="row">
      <label for="voice">声</label>
      <select id="voice"></select>
    </div>
  </div>

  <p class="hint" id="hint"></p>

<script>
  const synth = window.speechSynthesis;
  const btn = document.getElementById("sayBtn");
  const rate = document.getElementById("rate");
  const pitch = document.getElementById("pitch");
  const voiceSel = document.getElementById("voice");
  const hint = document.getElementById("hint");

  const TEXT = "すみません";
  let jaVoices = [];

  if (!synth) {
    hint.textContent = "このブラウザは音声合成に対応していません。";
    btn.disabled = true;
  }

  function loadVoices() {
    const all = synth.getVoices();
    jaVoices = all.filter(v => v.lang && v.lang.toLowerCase().startsWith("ja"));
    voiceSel.innerHTML = "";

    const list = jaVoices.length ? jaVoices : all;
    if (!list.length) return;

    list.forEach((v, i) => {
      const opt = document.createElement("option");
      opt.value = v.name;
      opt.textContent = v.name + (v.lang ? " (" + v.lang + ")" : "");
      voiceSel.appendChild(opt);
    });

    if (!jaVoices.length) {
      hint.textContent = "日本語の音声が見つかりません。利用可能な声で再生します。";
    }
  }

  loadVoices();
  if (synth) synth.onvoiceschanged = loadVoices;

  function speak() {
    if (!synth) return;
    synth.cancel();

    const u = new SpeechSynthesisUtterance(TEXT);
    u.lang = "ja-JP";
    u.rate = parseFloat(rate.value);
    u.pitch = parseFloat(pitch.value);

    const all = synth.getVoices();
    const chosen = all.find(v => v.name === voiceSel.value);
    if (chosen) u.voice = chosen;

    btn.classList.add("pulsing");
    u.onend = () => btn.classList.remove("pulsing");
    u.onerror = () => btn.classList.remove("pulsing");

    synth.speak(u);
  }

  btn.addEventListener("click", speak);

  // Keyboard: スペース or Enter
  document.addEventListener("keydown", (e) => {
    if (e.code === "Space" || e.code === "Enter") {
      e.preventDefault();
      speak();
    }
  });
</script>
</body>
</html>
